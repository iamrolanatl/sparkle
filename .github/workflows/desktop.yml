name: Desktop agent
# Team D: desktop sync agent (TS core + Playwright vs mock portal) and the unsigned Tauri shell.
on:
  pull_request:
    paths: ["apps/desktop/**", "apps/api/src/ingest/**", ".github/workflows/desktop.yml", "pnpm-lock.yaml"]
  push:
    branches: [main]
    paths: ["apps/desktop/**", "apps/api/src/ingest/**", ".github/workflows/desktop.yml"]
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  agent-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sparkle/desktop exec playwright install --with-deps chromium
      - name: Desktop agent vs mock portal (Playwright)
        run: pnpm --filter @sparkle/desktop e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: desktop-e2e
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
  tauri-check:
    # Compile-check the unsigned Tauri shell (no bundling, no signing) + RustSec advisories.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo check --locked
      - run: cargo test --locked
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: apps/desktop/src-tauri/Cargo.toml
          command: check advisories
