name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Unused code & dependencies (knip)
        run: pnpm knip
      - name: Typecheck
        run: pnpm typecheck
      - name: Test (unit + Supabase RLS via PGlite)
        run: pnpm test
      - name: Build
        run: pnpm build
        env:
          # Public values only; build does not need secrets.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - name: Build web worker (OpenNext)
        run: pnpm --filter @sparkle/web build:worker
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - name: Install k6
        run: |
          curl -sL https://github.com/grafana/k6/releases/download/v1.3.0/k6-v1.3.0-linux-amd64.tar.gz | tar xz
          sudo mv k6-v1.3.0-linux-amd64/k6 /usr/local/bin/k6
      - name: Load smoke (k6 vs local API)
        working-directory: apps/api
        run: |
          pnpm exec wrangler dev -c wrangler.ci.toml --port 8788 > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 30); do curl -fs localhost:8788/health >/dev/null && break; sleep 2; done
          k6 run --quiet ../../tests/load/smoke.js || (cat /tmp/wrangler.log; exit 1)
  e2e:
    # CR-0008: Playwright E2E + visual regression, Lighthouse mobile budget (NFR-47).
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://nklbdyezbsugkdvaidtt.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'pk_ci_placeholder' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sparkle/web build
      - run: pnpm --filter @sparkle/web exec playwright install --with-deps chromium
      - name: Playwright (E2E + visual)
        run: pnpm --filter @sparkle/web e2e
      - name: Lighthouse CI (mobile >= 90)
        working-directory: apps/web
        run: npx -y @lhci/cli@0.15 autorun
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/.lighthouseci
