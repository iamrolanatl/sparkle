name: Deploy API worker
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to deploy sparkle-api to Cloudflare'
        required: true
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sparkle/api test
      - name: Deploy
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          pnpm exec wrangler deploy
          if [ -n "$SUPABASE_SECRET_KEY" ]; then
            printf '%s' "$SUPABASE_SECRET_KEY" | pnpm exec wrangler secret put SUPABASE_SECRET_KEY
          fi
          curl -fsS "https://sparkle-api.$(pnpm exec wrangler whoami 2>/dev/null | grep -o '[a-z0-9-]*\.workers\.dev' | head -1 || true)/health" || echo "Check /health manually on the workers.dev URL printed above"
