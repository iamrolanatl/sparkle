# Account ID comes from CLOUDFLARE_ACCOUNT_ID env var (not committed).
name = "sparkle-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[vars]
APP_ENV = "dev"  # only deployed worker is dev (workers.dev); production sets APP_ENV="production" in its own [env.production] block (WBS 2.8)
SUPABASE_URL = "https://nklbdyezbsugkdvaidtt.supabase.co"
AI_GATEWAY_ID = "sparkle-gateway"
ALLOWED_ORIGINS = "https://sparkle-web.crystal-iamrolan.workers.dev,http://localhost:3000"  # add production domain when known (WBS 2.8)
# Secrets (set with `wrangler secret put`): SUPABASE_SECRET_KEY, SUPABASE_PUBLISHABLE_KEY

# Sales/support chat (FR-19): Workers AI through AI Gateway
[ai]
binding = "AI"

[[ratelimits]]
name = "CHAT_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# R2 (private, ENAM; no public access). Vault use is behind feature flag vault_enabled=false until legal/security review.
[[r2_buckets]]
binding = "SCANS_BUCKET"
bucket_name = "sparkle-scans"

[[r2_buckets]]
binding = "VAULT_BUCKET"
bucket_name = "sparkle-vault"

# Today document cache (WBS 3.4, CR-0007)
[[kv_namespaces]]
binding = "TODAY_CACHE"
id = "73fefa053a9b434f9a36d5d16a1ae283"

# OCR scan jobs (Team B, FR-23). Free-tier queue created 2026-10-21 (DEC-73). SCANS_OCR_SERVER stays OFF (R-23 data location).
[[queues.producers]]
binding = "SCAN_QUEUE"
queue = "sparkle-scans-ocr"

[[queues.consumers]]
queue = "sparkle-scans-ocr"
max_batch_size = 5
max_retries = 3
dead_letter_queue = "sparkle-scans-ocr-dlq"  # free queue; poison messages land here after 3 retries (no consumer; inspect manually)

# Daily jobs (UTC). 03:30 = vaultDaily (Team C) + purgeScans (Team B, DEC-126 30-day purge) — dispatched via src/scheduled.ts.
[triggers]
crons = ["30 3 * * *"]
