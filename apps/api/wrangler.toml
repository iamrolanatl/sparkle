# Account ID comes from CLOUDFLARE_ACCOUNT_ID env var (not committed).
name = "sparkle-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[vars]
APP_ENV = "production"
SUPABASE_URL = "https://nklbdyezbsugkdvaidtt.supabase.co"
AI_GATEWAY_ID = "sparkle-gateway"
ALLOWED_ORIGINS = "https://sparkle-web.crystal-iamrolan.workers.dev,http://localhost:3000"  # add production domain when known (WBS 2.8)
# Secrets (set with `wrangler secret put`): SUPABASE_SECRET_KEY

# Sales/support chat (FR-19): Workers AI through AI Gateway
[ai]
binding = "AI"

[[ratelimits]]
name = "CHAT_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# R2 (private, ENAM; no public access). Vault use is behind feature flag vault_enabled=false until legal/security review.
[[r2_buckets]]
binding = "SCANS_BUCKET"
bucket_name = "sparkle-scans"

[[r2_buckets]]
binding = "VAULT_BUCKET"
bucket_name = "sparkle-vault"
