# Synthetic uptime probe (SLO-Dashboards.md). Free tier: 288 cron runs/day.
name = "sparkle-synthetic"
main = "src/synthetic/monitor.ts"
compatibility_date = "2025-09-01"
workers_dev = false

[triggers]
crons = ["*/5 * * * *"]

[vars]
API_URL = "https://sparkle-api.crystal-iamrolan.workers.dev"
WEB_URL = "https://sparkle-web.crystal-iamrolan.workers.dev"

[observability]
enabled = true
